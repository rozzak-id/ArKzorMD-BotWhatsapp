services:
  arkzormd:
    build:
      context: .
    image: arkzormd:local
    container_name: arkzormd
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
